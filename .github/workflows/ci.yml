---

**GitHub Pages Deployment Pipeline (`.github/workflows/docs.yml`)**
Create `.github/workflows/docs.yml` to automatically build your Sphinx project and deploy it to GitHub Pages whenever changes hit the main branch.

```yaml
name: Deploy Sphinx Docs to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install sphinx furo myst-parser sphinx_copybutton sphinxcontrib-mermaid

      - name: Build Documentation
        run: |
          sphinx-build -b html docs/source docs/build/html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build/html

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.output_url }}
    runs-on: github-pages
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4